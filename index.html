<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Family Dashboard</title>
<style>
:root{--bg:#cfd3d8;--card:#f7f8fa;--ink:#1f2937;--muted:#64748b;--navy:#243b5a;--blue:#2f6fb5;--green:#3d8b68;--done:#dff3e7;--amber:#fff1c7;--red:#fde2e2;--line:#d7dde4;--accent:#0f172a;--jrTint:#e8f1fb;--xTint:#e8f5ee;--erekTint:#fdeaea}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{padding:20px;min-height:100vh}.top{display:grid;grid-template-columns:1.4fr 1fr auto;gap:16px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.day{font-size:clamp(34px,4vw,58px);font-weight:800}.date{font-size:clamp(17px,2vw,27px);color:var(--muted);margin-top:6px}.weather{display:flex;align-items:center;gap:14px}.wxicon{font-size:48px}.wxtemp{font-size:42px;font-weight:800}.wxsub{color:var(--muted)}.topactions{display:grid;gap:10px}.topbtn{border:0;border-radius:16px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:800;min-width:130px}.refreshbtn{background:#475569}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.section h2{margin:0 0 12px;font-size:clamp(26px,2.5vw,38px)}.family h2{color:var(--navy)}.jr h2{color:var(--blue)}.xavier h2{color:var(--green)}.list{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;min-height:64px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}.task{width:100%;text-align:left;color:var(--ink)}.task.done{background:var(--done);opacity:.72;text-decoration:line-through}.icon{font-size:26px;min-width:34px;text-align:center}.txt{flex:1}.title{font-size:18px;font-weight:750}.meta{font-size:14px;color:var(--muted);margin-top:3px}.check{font-size:28px}.important{background:var(--red)}.upcoming{background:var(--amber)}.family-jr{background:var(--jrTint);border-left:6px solid var(--blue)}.family-xavier{background:var(--xTint);border-left:6px solid var(--green)}.family-erek{background:var(--erekTint);border-left:6px solid #b94141}.progress{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:8px 0 14px}.bar{height:100%}.jr .bar{background:var(--blue)}.xavier .bar{background:var(--green)}.timerrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.timer{font-size:30px;font-weight:800}.btn{border:0;border-radius:12px;padding:10px 15px;background:#e2e8f0;font-weight:700}.subhead{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.status{font-size:12px;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal.open{display:flex}.editor{width:min(900px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field textarea{width:100%;min-height:125px;padding:12px;border:1px solid var(--line);border-radius:12px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.primary,.secondary{border-radius:12px;padding:12px 18px;font-weight:700}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff}.notice{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr 1fr}.topactions{grid-column:1/-1;grid-template-columns:1fr 1fr}.editor-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><div class="app">
<div class="top"><div class="card"><div id="day" class="day"></div><div id="date" class="date"></div></div><div class="card weather"><div id="wxicon" class="wxicon">⛅</div><div><div id="wxtemp" class="wxtemp">--°</div><div id="wxsub" class="wxsub">Poplar Grove, IL</div></div></div><div class="topactions"><button id="openEditor" class="topbtn">Parent Edit</button><button id="refreshPage" class="topbtn refreshbtn">↻ Refresh</button></div></div>
<div class="grid">
<section class="card section family"><h2>Family</h2><div id="familyTasks" class="list"></div><div class="subhead">UPCOMING FAMILY CALENDAR</div><div id="familyEvents" class="list"></div><div id="feedStatus" class="status"></div><div class="subhead">SCHOOL CALENDAR</div><div id="schoolEvents" class="list"></div></section>
<section class="card section jr"><h2>Erek Jr.</h2><div id="jrProgressText" class="date"></div><div class="progress"><div id="jrProgress" class="bar"></div></div><div class="subhead">THIS WEEK REMINDERS</div><div id="jrReminders" class="list"></div><div class="subhead">TO STUDY AND PRACTICE</div><div id="jrStudy" class="list"></div><div class="subhead">HOMEWORK</div><div id="jrHomework" class="list"></div><div class="subhead">CHORES</div><div id="jrChores" class="list"></div><div id="jrExtra" class="list"></div><div class="timerrow"><div id="timer" class="timer">10:00</div><button id="start" class="btn">Start</button><button id="reset" class="btn">Reset</button></div></section>
<section class="card section xavier"><h2>Xavier</h2><div id="xProgressText" class="date"></div><div class="progress"><div id="xProgress" class="bar"></div></div><div class="subhead">THIS WEEK REMINDERS</div><div id="xReminders" class="list"></div><div class="subhead">TO STUDY AND PRACTICE</div><div id="xStudy" class="list"></div><div class="subhead">HOMEWORK</div><div id="xHomework" class="list"></div><div class="subhead">CHORES</div><div id="xChores" class="list"></div><div id="xExtra" class="list"></div></section>
</div></div>
<div id="modal" class="modal"><div class="editor"><h3>Parent Edit</h3><div class="editor-grid"><div class="field full"><label>Family — additional tasks, one per line</label><textarea id="familyInput"></textarea></div><div class="field"><label>Erek Jr. — additional tasks, one per line</label><textarea id="jrInput"></textarea></div><div class="field"><label>Xavier — additional tasks, one per line</label><textarea id="xInput"></textarea></div></div><div class="actions"><button id="clearEditor" class="secondary">Clear Added Tasks</button><button id="closeEditor" class="secondary">Cancel</button><button id="saveEditor" class="primary">Save</button></div><div class="notice">Parent edits are saved on this device.</div></div></div>
<script>
const FEED='https://script.google.com/macros/s/AKfycbyj5sSswCL-XPV_rL1Xf0pgByZA8tfOocTa_wwu1TA1UQSFqrIIM3O_PLU3Veg4W1hs/exec',EDIT_KEY='familyDashboardParentEditsV1';
const verses=[['2026-09-09','Psalm 30:10','Hear, O Lord, and be merciful to me!'],['2026-09-16','Zechariah 8:13','You shall be a blessing.'],['2026-09-23','Genesis 50:20','You meant evil against me, but God meant it for good.'],['2026-09-30','Psalm 50:15','Call upon Me in the day of trouble.'],['2026-10-07','Galatians 6:10','Bear one another’s burdens.'],['2026-10-14','Psalm 95:6','Oh come, let us worship and bow down.'],['2026-10-21','Joshua 1:9','Do not be afraid…for the Lord your God is with you.'],['2026-10-28','1 Samuel 3:10','Speak, for Your servant hears.'],['2026-11-04','Psalm 22:7','The Lord is my strength.'],['2026-11-11','Psalm 122:1','Let us go to the house of the Lord!'],['2026-11-18','1 Kings 18:39','The Lord, He is God.'],['2026-11-24','Exodus 20:4','You shall not make for yourself a carved image.'],['2026-12-02','Jeremiah 10:1','Hear the word that the Lord speaks to you.'],['2026-12-09','Jeremiah 29:11','For I know the plans I have for you…to give you a future and a hope.'],['2026-12-16','Luke 1:47','My spirit rejoices in God my Savior.']];
const spelling=['met','leg','pen','fed','had','hop','mud','bed','be','pull'];
const xavierCalendar=[['2026-09-10','color','Yellow Day','yellow'],['2026-09-15','library','ILS Library',''],['2026-09-17','fieldtrip','Apple Orchard Field Trip',''],['2026-09-17','color','Red Day','red'],['2026-09-22','library','ILS Library',''],['2026-09-24','color','Green Day','green'],['2026-09-29','library','ILS Library',''],['2026-09-30','student','Xavier — Student of the Day','X']];
const schoolCalendar=[['2026-09-18','Free Non-Uniform Day',''],['2026-09-18','ILS Volleyball Tournament','Sep 18–19','2026-09-19'],['2026-10-02','Fee Non-Uniform Day',''],['2026-10-12','No School — Indigenous Peoples’ Day',''],['2026-10-16','No School — School Improvement Day',''],['2026-10-23','End of First Quarter — Half Day','8:00–11:30 AM']];
function localDate(){return new Date()}function ymd(d){return d.toLocaleDateString('en-CA')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function item(icon,title,meta='',cls=''){return `<div class="item ${cls}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div></div>`}
function task(kind,id,icon,title,meta=''){const key='fd-'+kind+'-'+ymd(localDate())+'-'+id,done=localStorage.getItem(key)==='1';return `<button class="item task ${done?'done':''}" data-key="${key}" data-kind="${kind}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div><div class="check">${done?'✓':'○'}</div></button>`}
function persistentTask(kind,key,icon,title,meta=''){const done=localStorage.getItem(key)==='1';return `<button class="item task ${done?'done':''}" data-key="${key}" data-kind="${kind}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div><div class="check">${done?'✓':'○'}</div></button>`}
function getEdits(){try{return JSON.parse(localStorage.getItem(EDIT_KEY)||'{"family":[],"jr":[],"x":[]}')}catch{return {family:[],jr:[],x:[]}}}function lines(v){return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function weeklyUniformKey(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return 'fd-fam-uniform-'+ymd(d)}function fridaySpellingKey(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((5-d.getDay()+7)%7));return 'fd-fam-spelling-upload-'+ymd(d)}
function currentVerse(){const now=new Date();for(const v of verses){if(now<new Date(v[0]+'T12:00:00'))return v}return verses.at(-1)}
function xavierTomorrowEvents(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+1);return xavierCalendar.filter(e=>e[0]===ymd(d))}
function inNextDays(dateStr,days=7){const s=new Date();s.setHours(0,0,0,0);const e=new Date(s);e.setDate(e.getDate()+days);const d=new Date(dateStr+'T12:00:00');return d>=s&&d<=e}
function upcomingSchoolItems(){return schoolCalendar.filter(e=>inNextDays(e[0],7))}
function upcomingXavierItems(){return xavierCalendar.filter(e=>inNextDays(e[0],7))}
function renderSchoolCalendar(){const up=upcomingSchoolItems();schoolEvents.innerHTML=up.length?up.map(x=>item('🏫',x[1],[new Date(x[0]+'T12:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),x[2]].filter(Boolean).join(' • '),'upcoming')).join(''):'<div class="empty">No school events in the next 7 days.</div>'}
function familyEventClass(title){const t=String(title||'').toLowerCase();if(t.includes('xavier')||t.includes('brother'))return 'family-xavier';if(t.includes('erek jr')||t.includes('nugget'))return 'family-jr';if(t.includes('allworld')||t.includes('all world')||t.includes('erek'))return 'family-erek';return ''}
function render(){
 const now=new Date(),dow=now.getDay(),today=ymd(now),edits=getEdits();day.textContent=now.toLocaleDateString([],{weekday:'long'});date.textContent=now.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});
 let fam=[],uk=weeklyUniformKey();if(localStorage.getItem(uk)!=='1')fam.push(persistentTask('fam',uk,'🧺','Wash uniforms & work clothes','Weekly Saturday task • stays until complete'));
 if(dow===5){const sk=fridaySpellingKey();if(localStorage.getItem(sk)!=='1')fam.push(persistentTask('fam',sk,'🔤','Upload Jr.’s new spelling words','Weekly Friday task • stays until complete'));}
 if(dow===2){fam.push(task('fam','trash','🗑️','Garbage night','Jr.: empty bedroom trash + bathroom trash • pickup Wednesday morning'));fam.push(task('fam','soccer-practice-coach','⚽','Pack soccer practice equipment + snacks','Erek is coaching Wednesday practice'))}
 if(dow===5)fam.push(task('fam','soccer-game-coach','⚽','Pack soccer game equipment + snacks','Erek is coaching Saturday games'));
 if(now.getFullYear()===2026&&now.getMonth()===9&&dow===4)fam.push(task('fam','breast-cancer-shirt','🎗️','Wear Breast Cancer Awareness shirt','Every Thursday in October'));
 if(today==='2026-09-14')fam.push(task('fam','hispanic-potluck','🥘','Bring something for Hispanic Heritage potluck','Work potluck is tomorrow — 9/15'));
 if(today==='2026-09-25')fam.push(item('🎉','Birthday / Anniversary potluck at work','Today','important'));
 edits.family.forEach((t,i)=>fam.push(task('fam','edit-'+i,'➕',t,'Parent-added')));familyTasks.innerHTML=fam.join('');
 const v=currentVerse();let jrR=[item('🔤','Spelling: '+spelling.join(' • '),'Test Friday'),item('📖',v[1]+' — '+v[2],'Memory verse','important')];upcomingSchoolItems().forEach(e=>jrR.push(item('🏫',e[1],[new Date(e[0]+'T12:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),e[2]].filter(Boolean).join(' • '),'upcoming')));if(today==='2026-09-15')jrR.push(item('🔬','Science Test','Today','important'));if(today==='2026-09-18')jrR.push(item('🍕','Pizza lunch order form due today','Return to school'));if(today==='2026-09-28')jrR.push(item('🍕','Pizza lunch tomorrow — 9/29','School lunch reminder','upcoming'));jrReminders.innerHTML=jrR.join('');
 let jrS=[task('jr','memory','📖','Recite memory verse'),task('jr','spelling','✏️','Write and spell spelling words')];if(['2026-09-10','2026-09-11','2026-09-13','2026-09-14'].includes(today))jrS.push(task('jr','science-review','🔬','Study for science test','Identify life stages • Habitat: chipmunk, lake, house, plants • Draw and write all 4'));if(today==='2026-09-14')jrS.push(task('jr','science-test-tomorrow','🔬','Science test tomorrow','Review science sheet tonight'));if(dow===2)jrS.push(task('jr','soccerbag-practice','⚽','Pack soccer bag','For Wednesday practice'));if(dow===4)jrS.push(task('jr','spelling-test-tomorrow','📝','Spelling test tomorrow','Write and spell spelling words tonight'));if(dow===5)jrS.push(task('jr','soccerbag-game','⚽','Pack soccer bag','For Saturday game'));jrStudy.innerHTML=jrS.join('');
 let jrH=[];if(dow>=1&&dow<=5){jrH.push(task('jr','read','📚','Read at least 10 minutes','Parent: fill in reading log'));jrH.push(task('jr','math','➗','Complete math homework','Check folder and return completed work'))}if(today<='2026-09-18')jrH.push(task('jr','pizza-form','🍕','Return pizza lunch order form','Due Friday 9/18'));jrHomework.innerHTML=jrH.length?jrH.join(''):'<div class="empty">No homework tasks today.</div>';
 let jrC=[];if(dow===2)jrC.push(task('jr','empty-garbage','🗑️','Empty garbages','Bedroom + bathroom'));if(dow===5)jrC.push(task('jr','clean-bedroom','🧹','Clean bedroom','Friday chore'));if(dow===0)jrC.push(task('jr','clean-living-room','🧹','Clean living room','Sunday chore'));jrChores.innerHTML=jrC.length?jrC.join(''):'<div class="empty">No chores today.</div>';
 let jrE=[];if(dow===3)jrE.push(task('jr','librarypack','📚','Pack library book tonight','Library is Thursday'));edits.jr.forEach((t,i)=>jrE.push(task('jr','edit-'+i,'➕',t,'Parent-added')));jrExtra.innerHTML=jrE.join('');
 let xR=[];upcomingXavierItems().forEach(e=>xR.push(item(e[1]==='fieldtrip'?'🍎':e[1]==='library'?'📚':e[1]==='color'?'👕':'⭐',e[2],[new Date(e[0]+'T12:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),e[3]&&e[1]==='color'?'Wear '+e[3]:e[3]].filter(Boolean).join(' • '),'upcoming')));upcomingSchoolItems().forEach(e=>xR.push(item('🏫',e[1],[new Date(e[0]+'T12:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),e[2]].filter(Boolean).join(' • '),'upcoming')));if(dow>=2&&dow<=4)xR.unshift(item('🎒','School Tuesday–Thursday','Today is a school day'));if(today==='2026-09-17')xR.push(item('🍕','Pizza lunch order form due today','Last school day before Friday deadline'));if(today==='2026-09-28')xR.push(item('🍕','Pizza lunch tomorrow — 9/29','School lunch reminder','upcoming'));xReminders.innerHTML=xR.length?xR.join(''):'<div class="empty">No school reminders in the next 7 days.</div>';
 let xS=[];if(today==='2026-09-10')xS.push(task('x','fieldtrip-permission-slip','📝','Turn in field trip permission slip tomorrow','Put signed permission slip in backpack tonight'));xavierTomorrowEvents().forEach(e=>{if(e[1]!=='library'){if(e[1]==='student')xS.push(task('x','prep-student-'+e[0],'⭐','Pack Student of the Day item','Show-and-tell item begins with X'));if(e[1]==='color')xS.push(task('x','prep-color-'+e[0],'👕','Wear '+e[3]+' tomorrow','Color Day'));if(e[1]==='fieldtrip')xS.push(task('x','prep-trip-'+e[0],'🍎','Prep for Apple Orchard field trip','Field trip tomorrow'))}});if(dow===1){xS.push(task('x','prepare-backpack-monday','🎒','Prepare backpack to return to school','For Tuesday'));const tomorrow=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));if(xavierCalendar.some(e=>e[0]===tomorrow&&e[1]==='library'))xS.push(task('x','library-monday','📚','Pack library books','Library is Tuesday'))}if(dow===2||dow===3)xS.push(task('x','backpack-parent','🎒','Empty backpack with parent + prepare for next day','Check papers, supplies, and anything to return'));if(dow===4)xS.push(task('x','backpack-thursday','🎒','Empty backpack with parent + check for homework','No school tomorrow'));if(dow===5)xS.push(task('x','soccer-pack','⚽','Pack soccer things','For Saturday morning practice/game'));xStudy.innerHTML=xS.length?xS.join(''):'<div class="empty">No study or prep tasks today.</div>';
 let xH=[];if(today<='2026-09-17')xH.push(task('x','pizza-form','🍕','Return pizza lunch order form','Due Thursday 9/17 for Xavier'));xHomework.innerHTML=xH.length?xH.join(''):'<div class="empty">No homework tasks today.</div>';
 let xC=[];if(dow===2)xC.push(task('x','dirty-clothes','🧺','Gather dirty clothes','Tuesday chore'));if(dow===5)xC.push(task('x','clean-living-room','🧹','Clean living room','Friday chore'));if(dow===0)xC.push(task('x','clean-bedroom','🧹','Clean bedroom','Sunday chore'));xChores.innerHTML=xC.length?xC.join(''):'<div class="empty">No chores today.</div>';
 let xE=[];edits.x.forEach((t,i)=>xE.push(task('x','edit-'+i,'➕',t,'Parent-added')));xExtra.innerHTML=xE.join('');
 renderSchoolCalendar();document.querySelectorAll('.task').forEach(b=>b.onclick=()=>{localStorage.setItem(b.dataset.key,b.classList.contains('done')?'0':'1');render()});updateProgress('jr');updateProgress('x')
}
function updateProgress(k){const a=[...document.querySelectorAll(`.task[data-kind="${k}"]`)],d=a.filter(x=>x.classList.contains('done')).length,p=a.length?Math.round(d/a.length*100):0;if(k==='jr'){jrProgressText.textContent=`${d} of ${a.length} done`;jrProgress.style.width=p+'%'}else{xProgressText.textContent=`${d} of ${a.length} done`;xProgress.style.width=p+'%'}}
async function familyFeed(){try{feedStatus.textContent='Updating…';const r=await fetch(FEED,{cache:'no-store'}),j=await r.json(),s=new Date();s.setHours(0,0,0,0);const e=new Date(s);e.setDate(e.getDate()+7);const ev=(j.events||[]).filter(x=>{if(String(x.title||'').toLowerCase().includes('map testing'))return false;const raw=x.startDate||x.start||x.date;if(!raw)return false;const d=new Date(raw);return !Number.isNaN(d)&&d>=s&&d<=e});familyEvents.innerHTML=ev.length?ev.map(x=>item('📅',x.title,[x.day,x.date,[x.startTime,x.endTime].filter(Boolean).join('–')].filter(Boolean).join(' • '),familyEventClass(x.title))).join(''):'<div class="empty">No family events in the next 7 days.</div>';feedStatus.textContent='Family calendar updated automatically'}catch{familyEvents.innerHTML='<div class="empty">Family calendar unavailable.</div>'}}
async function weather(){try{const j=await fetch('https://api.open-meteo.com/v1/forecast?latitude=42.37&longitude=-88.82&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago',{cache:'no-store'}).then(r=>r.json()),c=j.current;wxtemp.textContent=Math.round(c.temperature_2m)+'°';wxsub.textContent='Poplar Grove, IL'}catch{wxsub.textContent='Poplar Grove, IL • weather unavailable'}}
let sec=600,int=null;function paint(){timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}start.onclick=()=>{if(int){clearInterval(int);int=null;start.textContent='Start';return}start.textContent='Pause';int=setInterval(()=>{if(sec>0){sec--;paint()}else{clearInterval(int);int=null;start.textContent='Start'}},1000)};reset.onclick=()=>{clearInterval(int);int=null;sec=600;paint();start.textContent='Start'};
openEditor.onclick=()=>{const e=getEdits();familyInput.value=(e.family||[]).join('\n');jrInput.value=(e.jr||[]).join('\n');xInput.value=(e.x||[]).join('\n');modal.classList.add('open')};closeEditor.onclick=()=>modal.classList.remove('open');saveEditor.onclick=()=>{localStorage.setItem(EDIT_KEY,JSON.stringify({family:lines(familyInput.value),jr:lines(jrInput.value),x:lines(xInput.value)}));modal.classList.remove('open');render()};clearEditor.onclick=()=>{localStorage.removeItem(EDIT_KEY);render()};refreshPage.onclick=()=>location.replace(location.pathname+'?refresh='+Date.now());
render();familyFeed();weather();setInterval(render,60000);setInterval(familyFeed,15*60000);setInterval(weather,30*60000);
</script></body></html>
