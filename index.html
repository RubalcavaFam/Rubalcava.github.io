<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Family Dashboard</title>
<style>
:root{--bg:#cfd3d8;--card:#f7f8fa;--ink:#1f2937;--muted:#64748b;--navy:#243b5a;--blue:#2f6fb5;--green:#3d8b68;--done:#dff3e7;--amber:#fff1c7;--red:#fde2e2;--line:#d7dde4;--accent:#0f172a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{padding:20px;min-height:100vh}.top{display:grid;grid-template-columns:1.4fr 1fr auto;gap:16px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.day{font-size:clamp(34px,4vw,58px);font-weight:800}.date{font-size:clamp(17px,2vw,27px);color:var(--muted);margin-top:6px}.weather{display:flex;align-items:center;gap:14px}.wxicon{font-size:48px}.wxtemp{font-size:42px;font-weight:800}.wxsub{color:var(--muted)}.topactions{display:grid;gap:10px;align-content:stretch}.topbtn{border:0;border-radius:16px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:800;min-width:130px}.refreshbtn{background:#475569}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.section h2{margin:0 0 12px;font-size:clamp(26px,2.5vw,38px)}.family h2{color:var(--navy)}.jr h2{color:var(--blue)}.xavier h2{color:var(--green)}.list{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;min-height:64px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}.task{width:100%;text-align:left;color:var(--ink)}.task.done{background:var(--done);opacity:.72;text-decoration:line-through}.icon{font-size:26px;min-width:34px;text-align:center}.txt{flex:1;min-width:0}.title{font-size:18px;font-weight:750}.meta{font-size:14px;color:var(--muted);margin-top:3px}.check{font-size:28px}.important{background:var(--red)}.upcoming{background:var(--amber)}.progress{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:8px 0 14px}.bar{height:100%;width:0}.jr .bar{background:var(--blue)}.xavier .bar{background:var(--green)}.timerrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.timer{font-size:30px;font-weight:800}.btn{border:0;border-radius:12px;padding:10px 15px;background:#e2e8f0;font-weight:700}.subhead{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.status{font-size:12px;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal.open{display:flex}.editor{width:min(900px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.editor h3{margin:0 0 14px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field textarea{width:100%;min-height:125px;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.primary,.secondary{border-radius:12px;padding:12px 18px;font-weight:700}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff}.notice{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr 1fr}.topactions{grid-column:1/-1;grid-template-columns:1fr 1fr}.editor-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><div class="app">
<div class="top"><div class="card"><div id="day" class="day"></div><div id="date" class="date"></div></div><div class="card weather"><div id="wxicon" class="wxicon">⛅</div><div><div id="wxtemp" class="wxtemp">--°</div><div id="wxsub" class="wxsub">Poplar Grove, IL</div></div></div><div class="topactions"><button id="openEditor" class="topbtn">Parent Edit</button><button id="refreshPage" class="topbtn refreshbtn">↻ Refresh</button></div></div>
<div class="grid">
<section class="card section family"><h2>Family</h2><div id="familyTasks" class="list"></div><div class="subhead">UPCOMING FAMILY CALENDAR</div><div id="familyEvents" class="list"></div><div id="feedStatus" class="status"></div><div class="subhead">SCHOOL CALENDAR</div><div id="schoolEvents" class="list"></div></section>
<section class="card section jr"><h2>Erek Jr.</h2><div id="jrProgressText" class="date"></div><div class="progress"><div id="jrProgress" class="bar"></div></div><div id="jrTasks" class="list"></div><div class="subhead">THIS WEEK</div><div id="jrInfo" class="list"></div><div class="timerrow"><div id="timer" class="timer">10:00</div><button id="start" class="btn">Start</button><button id="reset" class="btn">Reset</button></div></section>
<section class="card section xavier"><h2>Xavier</h2><div id="xProgressText" class="date"></div><div class="progress"><div id="xProgress" class="bar"></div></div><div id="xTasks" class="list"></div><div class="subhead">SCHOOL</div><div id="xInfo" class="list"></div></section>
</div></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Parent edit"><div class="editor"><h3>Parent Edit</h3><div class="editor-grid"><div class="field full"><label>Family — additional tasks, one per line</label><textarea id="familyInput" placeholder="Example: Return permission slip"></textarea></div><div class="field"><label>Erek Jr. — additional tasks, one per line</label><textarea id="jrInput"></textarea></div><div class="field"><label>Xavier — additional tasks, one per line</label><textarea id="xInput"></textarea></div></div><div class="actions"><button id="clearEditor" class="secondary">Clear Added Tasks</button><button id="closeEditor" class="secondary">Cancel</button><button id="saveEditor" class="primary">Save</button></div><div class="notice">Parent edits are saved on this device. Dashboard updates from GitHub remain separate and will continue to load normally.</div></div></div>
<script>
const FEED='https://script.google.com/macros/s/AKfycbyj5sSswCL-XPV_rL1Xf0pgByZA8tfOocTa_wwu1TA1UQSFqrIIM3O_PLU3Veg4W1hs/exec';
const EDIT_KEY='familyDashboardParentEditsV1';
const verses=[['2026-08-26','Job 19:25','For I know that my Redeemer lives.'],['2026-09-02','Psalm 31:14','I trust in You, O Lord.'],['2026-09-09','Psalm 30:10','Hear, O Lord, and be merciful to me!'],['2026-09-16','Zechariah 8:13','You shall be a blessing.'],['2026-09-23','Genesis 50:20','You meant evil against me, but God meant it for good.'],['2026-09-30','Psalm 50:15','Call upon Me in the day of trouble.'],['2026-10-07','Galatians 6:10','Bear one another’s burdens.'],['2026-10-14','Psalm 95:6','Oh come, let us worship and bow down.'],['2026-10-21','Joshua 1:9','Do not be afraid…for the Lord your God is with you.'],['2026-10-28','1 Samuel 3:10','Speak, for Your servant hears.'],['2026-11-04','Psalm 22:7','The Lord is my strength.'],['2026-11-11','Psalm 122:1','Let us go to the house of the Lord!'],['2026-11-18','1 Kings 18:39','The Lord, He is God.'],['2026-11-24','Exodus 20:4','You shall not make for yourself a carved image.'],['2026-12-02','Jeremiah 10:1','Hear the word that the Lord speaks to you.'],['2026-12-09','Jeremiah 29:11','For I know the plans I have for you…to give you a future and a hope.'],['2026-12-16','Luke 1:47','My spirit rejoices in God my Savior.']];
const spelling=['sat','tag','mad','gap','hit','dim','lip','six','not','does'];
const schoolCalendar=[['2026-08-27','Fall School Pictures',''],['2026-09-04','Fee Non-Uniform Day',''],['2026-09-07','No School — Labor Day',''],['2026-09-14','MAP Testing','Grades 2–8 • Sep 14–25','2026-09-25'],['2026-09-18','Free Non-Uniform Day',''],['2026-09-18','ILS Volleyball Tournament','Sep 18–19','2026-09-19'],['2026-10-02','Fee Non-Uniform Day',''],['2026-10-12','No School — Indigenous Peoples’ Day',''],['2026-10-16','No School — School Improvement Day',''],['2026-10-23','End of First Quarter — Half Day','8:00–11:30 AM'],['2026-10-29','Parent Teacher Conferences','3:30–7:30 PM'],['2026-11-03','Parent Teacher Conferences','3:30–7:30 PM'],['2026-11-06','Fee Non-Uniform Day',''],['2026-11-20','ILS Basketball Tournament','Nov 20–21','2026-11-21'],['2026-11-20','Free Non-Uniform Day',''],['2026-11-25','No School — Thanksgiving Break','Nov 25–27','2026-11-27'],['2026-12-04','Fee Non-Uniform Day',''],['2026-12-18','Free Non-Uniform Day',''],['2026-12-18','Half Day of School','8:00–11:30 AM'],['2026-12-21','No School — Christmas Break','Dec 21–Jan 1','2027-01-01'],['2027-01-04','School Resumes',''],['2027-01-08','End of Second Quarter — Half Day','8:00–11:30 AM'],['2027-01-15','Fee Non-Uniform Day',''],['2027-01-15','Report Cards',''],['2027-01-18','No School — Martin Luther King Day',''],['2027-01-25','Lutheran Schools’ Week','Jan 25–29','2027-01-29'],['2027-01-25','MAP Testing','Grades 2–8 • Jan 25–Feb 5','2027-02-05'],['2027-02-05','Fee Non-Uniform Day',''],['2027-02-12','No School — School Improvement Day',''],['2027-02-15','No School — Presidents’ Day',''],['2027-02-19','Free Non-Uniform Day',''],['2027-03-05','Fee Non-Uniform Day',''],['2027-03-19','Free Non-Uniform Day',''],['2027-03-19','End of Third Quarter — Half Day','8:00–11:30 AM'],['2027-03-22','Spring Break + Easter Monday','Mar 22–29','2027-03-29'],['2027-03-30','School Resumes',''],['2027-03-30','Spring School Pictures',''],['2027-04-02','Fee Non-Uniform Day',''],['2027-04-02','Report Cards',''],['2027-04-12','MAP Testing','Grades 1–8 • Apr 12–23','2027-04-23'],['2027-04-16','Free Non-Uniform Day',''],['2027-04-23','Grandparents’ Day','8:00–11:30 AM'],['2027-05-03','Teacher Appreciation Week','May 3–7','2027-05-07'],['2027-05-07','Fee Non-Uniform Day',''],['2027-05-07','Race for Education Day',''],['2027-05-10','Race for Education Rain Date',''],['2027-05-20','BIG Friend/LITTLE Friend Picnic',''],['2027-05-21','Closing Worship','8:00–10:00 AM'],['2027-05-21','End of Fourth Quarter','45 days'],['2027-05-21','Last Day of School — Half Day','8:00–11:30 AM']];
function localDate(){return new Date()}function ymd(d){return d.toLocaleDateString('en-CA')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setDate(){const d=localDate();day.textContent=d.toLocaleDateString([], {weekday:'long'});date.textContent=d.toLocaleDateString([], {month:'long',day:'numeric',year:'numeric'})}function item(icon,title,meta='',cls=''){return `<div class="item ${cls}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div></div>`}function task(kind,id,icon,title,meta=''){const key='fd-'+kind+'-'+ymd(localDate())+'-'+id;const done=localStorage.getItem(key)==='1';return `<button class="item task ${done?'done':''}" data-key="${key}" data-kind="${kind}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div><div class="check">${done?'✓':'○'}</div></button>`}function persistentTask(kind,key,icon,title,meta=''){return `<button class="item task" data-key="${key}" data-kind="${kind}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div><div class="check">○</div></button>`}function bindTasks(){document.querySelectorAll('.task').forEach(b=>b.onclick=()=>{localStorage.setItem(b.dataset.key,b.classList.contains('done')?'0':'1');render()})}function dayNum(){return localDate().getDay()}function currentVerse(){const today=ymd(localDate());return verses.find(v=>v[0]>=today)||verses[verses.length-1]}function getEdits(){try{return JSON.parse(localStorage.getItem(EDIT_KEY)||'{"family":[],"jr":[],"x":[]}')}catch(e){return {family:[],jr:[],x:[]}}}function lines(v){return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function weeklyUniformKey(){const d=new Date(localDate());d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return 'fd-fam-uniform-'+ymd(d)}
function renderSchoolCalendar(){const start=new Date(localDate());start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+7);const upcoming=schoolCalendar.filter(e=>{const s=new Date(e[0]+'T12:00:00');const ee=new Date((e[3]||e[0])+'T12:00:00');return ee>=start&&s<=end});schoolEvents.innerHTML=upcoming.length?upcoming.map(e=>{const d=new Date(e[0]+'T12:00:00');const ds=d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});return item('🏫',e[1],[ds,e[2]].filter(Boolean).join(' • '),'upcoming')}).join(''):'<div class="empty">No school events in the next 7 days.</div>'}
function isSchoolEventTitle(title){const n=String(title||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();return schoolCalendar.some(e=>{const s=e[1].toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();return n===s||n.includes(s)||s.includes(n)})}
function mondayNoSchoolAfterSunday(){const d=new Date(localDate());d.setHours(12,0,0,0);d.setDate(d.getDate()+1);const monday=ymd(d);return schoolCalendar.some(e=>e[0]===monday&&String(e[1]).toLowerCase().includes('no school'))}
function render(){setDate();const dow=dayNum(),today=ymd(localDate()),edits=getEdits();let fam=[];const uniformKey=weeklyUniformKey();if(localStorage.getItem(uniformKey)!=='1')fam.push(persistentTask('fam',uniformKey,'🧺','Wash uniforms & work clothes','Weekly Saturday task • stays until complete'));if(today==='2026-08-24'){fam.push(task('fam','x-bg','📝','Complete Background Authorization Check','Xavier — first day prep'));fam.push(task('fam','x-library','📚','Complete Library Card Child Registration Form','Xavier — first day prep'));fam.push(task('fam','x-aboutme','📝','Complete About Me packet','Xavier — first day prep'));fam.push(task('fam','x-photo','📷','Get family photo ready to send','Xavier — first day prep'));fam.push(task('fam','x-clothes','👕','Pack change of clothes for school','Send Tuesday'))}if(dow===2)fam.push(task('fam','trash','🗑️','Garbage night','Jr.: empty bedroom trash + bathroom trash • pickup Wednesday morning'));edits.family.forEach((t,i)=>fam.push(task('fam','edit-'+i,'➕',t,'Parent-added')));familyTasks.innerHTML=fam.join('');
let jr=[];jr.push(task('jr','memory','📖','Practice memory verse'));jr.push(task('jr','spelling','✏️','Write and spell spelling words'));if(dow>=1&&dow<=5)jr.push(task('jr','math','➗','Check folder for math homework','Return completed homework the next school day'));if(dow>=1&&dow<=5)jr.push(task('jr','read','📚','Read for 10 minutes','Weekday reading'));if(dow===0)jr.push(task('jr','reading-log','📘','Put reading log in backpack',mondayNoSchoolAfterSunday()?'Due Tuesday — no school Monday':'Due Monday'));if(dow===2)jr.push(task('jr','memory-test-tomorrow','🧠','Memory verse test tomorrow','Review memory verse tonight'));if(dow===4)jr.push(task('jr','spelling-test-tomorrow','📝','Spelling test tomorrow','Write and spell spelling words tonight'));if(dow===2||dow===0)jr.push(task('jr','footballpack','🏈','Pack for flag football tomorrow','Change of clothes • mouth guard • gym shoes'));if(dow===1||dow===3)jr.push(item('🏈','Flag football practice — 4:30–5:30 PM','Monday & Wednesday • season through Oct. 24','upcoming'));if(dow===3)jr.push(task('jr','librarypack','📚','Pack library book tonight','Library is Thursday'));if(dow===4)jr.push(item('📚','Library Day','Return previous book to check out a new one','upcoming'));if(dow===3)jr.push(item('⛪','Chapel + Memory Test','Wednesday','important'));if(dow===5)jr.push(item('📝','Spelling Test','Friday','important'));const d=localDate(),socStart=new Date('2026-09-12T00:00:00'),socEnd=new Date('2026-10-24T23:59:59');if(dow===6&&d>=socStart&&d<=socEnd)jr.push(item('⚽','Soccer game — 11:00 AM','Saturday','upcoming'));edits.jr.forEach((t,i)=>jr.push(task('jr','edit-'+i,'➕',t,'Parent-added')));jrTasks.innerHTML=jr.join('');const v=currentVerse();jrInfo.innerHTML=item('📖',v[1]+' — '+v[2],'Memory test '+new Date(v[0]+'T12:00:00').toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}),'important')+item('🔤','Spelling: '+spelling.join(' • '),'Test Friday');
let xt=[];if(today==='2026-08-24'){xt.push(task('x','empty-backpack','🎒','Empty toys out of backpack','First day prep'));xt.push(task('x','pack-school','🎒','Pack school items','First day prep'))}if(today<='2026-08-27')xt.push(task('x','aboutme-collage','🖍️','Create About Me collage page','Due Thursday 8/27'));if([2,3,4].includes(dow))xt.push(task('x','school','🎒','School today'));else xt.push(item('🏠','No school today','School is Tuesday–Thursday'));edits.x.forEach((t,i)=>xt.push(task('x','edit-'+i,'➕',t,'Parent-added')));xTasks.innerHTML=xt.join('');xInfo.innerHTML=item('🎒','School Tuesday–Thursday','')+item('🛏️','Extended Care','Bring quiet-time gear on attendance days only');renderSchoolCalendar();bindTasks();updateProgress('jr');updateProgress('x')}
function updateProgress(kind){const all=[...document.querySelectorAll(`.task[data-kind="${kind}"]`)],done=all.filter(x=>x.classList.contains('done')).length,pct=all.length?Math.round(done/all.length*100):0;if(kind==='jr'){jrProgressText.textContent=`${done} of ${all.length} done`;jrProgress.style.width=pct+'%'}else{xProgressText.textContent=`${done} of ${all.length} done`;xProgress.style.width=pct+'%'}}
async function familyFeed(){try{feedStatus.textContent='Updating…';const r=await fetch(FEED,{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();if(!j.ok)throw new Error();const events=(j.events||[]).filter(e=>!isSchoolEventTitle(e.title));familyEvents.innerHTML=events.length?events.map(e=>item('📅',e.title,[e.day,e.date,[e.startTime,e.endTime].filter(Boolean).join('–')].filter(Boolean).join(' • '))).join(''):'<div class="empty">No upcoming family events.</div>';feedStatus.textContent='Family calendar updated automatically'}catch(e){familyEvents.innerHTML='<div class="empty">Family calendar unavailable.</div>';feedStatus.textContent='Check calendar feed deployment/access settings'}}
async function weather(){try{const j=await fetch('https://api.open-meteo.com/v1/forecast?latitude=42.37&longitude=-88.82&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago',{cache:'no-store'}).then(r=>r.json()),c=j.current;wxtemp.textContent=Math.round(c.temperature_2m)+'°';const code=c.weather_code;wxicon.textContent=code===0?'☀️':[1,2].includes(code)?'🌤️':code===3?'☁️':[61,63,65,80,81,82].includes(code)?'🌧️':[71,73,75,85,86].includes(code)?'❄️':[95,96,99].includes(code)?'⛈️':'⛅';wxsub.textContent='Poplar Grove, IL'}catch(e){wxsub.textContent='Poplar Grove, IL • weather unavailable'}}
let sec=600,int=null;function paint(){timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}start.onclick=()=>{if(int){clearInterval(int);int=null;start.textContent='Start';return}start.textContent='Pause';int=setInterval(()=>{if(sec>0){sec--;paint()}else{clearInterval(int);int=null;start.textContent='Start';alert('Reading / focus session complete!')}},1000)};reset.onclick=()=>{if(int)clearInterval(int);int=null;sec=600;paint();start.textContent='Start'};
const modal=document.getElementById('modal'),familyInput=document.getElementById('familyInput'),jrInput=document.getElementById('jrInput'),xInput=document.getElementById('xInput');openEditor.onclick=()=>{const e=getEdits();familyInput.value=(e.family||[]).join('\n');jrInput.value=(e.jr||[]).join('\n');xInput.value=(e.x||[]).join('\n');modal.classList.add('open')};closeEditor.onclick=()=>modal.classList.remove('open');saveEditor.onclick=()=>{localStorage.setItem(EDIT_KEY,JSON.stringify({family:lines(familyInput.value),jr:lines(jrInput.value),x:lines(xInput.value)}));modal.classList.remove('open');render()};clearEditor.onclick=()=>{localStorage.removeItem(EDIT_KEY);familyInput.value='';jrInput.value='';xInput.value='';render()};refreshPage.onclick=()=>{location.replace(location.pathname+'?refresh='+Date.now())};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
async function checkForDashboardUpdate(){try{const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;const latest=await r.text();const current=document.documentElement.outerHTML;if(latest.length&&Math.abs(latest.length-current.length)>20){location.replace(location.pathname+'?v='+Date.now())}}catch(e){}}
render();familyFeed();weather();setInterval(setDate,60000);setInterval(familyFeed,15*60000);setInterval(weather,30*60000);setInterval(checkForDashboardUpdate,5*60000);
</script></body></html>
