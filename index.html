<style>:root{--bg:#cfd3d8;--card:#f7f8fa;--ink:#1f2937;--muted:#64748b;--navy:#243b5a;--blue:#2f6fb5;--green:#3d8b68;--done:#dff3e7;--amber:#fff1c7;--red:#fde2e2;--line:#d7dde4;--accent:#0f172a;--jrTint:#e8f1fb;--xTint:#e8f5ee;--erekTint:#fdeaea}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{padding:20px;min-height:100vh}.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:16px;margin-bottom:16px;align-items:stretch}.top>.card{min-height:0}.top>.card:first-child{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:14px;align-content:center}.top>.card:first-child .day,.top>.card:first-child .date{grid-column:1}.top>.card:first-child .calendarbtn{grid-column:2;grid-row:1/3;align-self:center;margin:0;white-space:nowrap}.weather{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:center;gap:16px}.weather-now{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;min-width:0}.weather-attire{min-width:0;border-left:1px solid var(--line);padding-left:16px}.attire-label{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.weather #dressGuide{line-height:1.3;margin:0!important}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.day{font-size:clamp(34px,4vw,58px);font-weight:800}.date{font-size:clamp(17px,2vw,27px);color:var(--muted);margin-top:6px}.weather{display:flex;align-items:center;gap:14px}.wxicon{font-size:48px}.wxtemp{font-size:42px;font-weight:800}.wxsub{color:var(--muted)}.topactions{display:grid;gap:10px}.topbtn{border:0;border-radius:16px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:800;min-width:130px}.refreshbtn{background:#475569}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.section h2{margin:0 0 12px;font-size:clamp(2 elf:start;margin-top:10px}.weather{grid-template-columns:auto 1fr}.wxicon{font-size:36px}.wxtemp{font-size:34px}}@media(max-width:520px){.calendar-panel{padding:14px}.calendar-grid{gap:4px}.cal-day{min-height:46px;font-size:16px}.cal-day.today{font-size:18px}.cal-dow{font-size:10px}}</style></head><body><div class="app"><div class="top"><div class="card"><div id="day" class="day"></div><div id="date" class="date"></div><button id="openJrCalendar" class="calendarbtn" style="margin-top:14px">📅 Open Monthly Calendar</button></div><div class="card weather"><div class="weather-now"><div class="wxicon">⛅</div><div><div id="wxtemp" class="wxtemp">--°</div><div id="wxsub" class="wxsub">Poplar Grove, IL</div></div></div><div class="weather-attire"><div class="attire-label">WHAT TO WEAR</div><div id="dressGuide" class="meta" style="font-size:15px;font-weight:700">🧥 Checking what to wear…</div></div></div><div class="topactions"><button id="openEditor" class="topbtn">Parent Edit</button><button id="refreshPage" class="topbtn refreshbtn">↻ Refresh</button></div></div><div class="grid"><section class="card section family"><h2>Family</h2><div id="familyTasks" class="list"></div><div class="subhead">UPCOMING FAMILY CALENDAR</div><div id="familyEvents" class="list"></div><div id="feedStatus" class="status"></div><div class="subhead">SCHOOL CALENDAR</div><div id="schoolEvents" class="list"></div></section><section class="card section jr"><h2>Erek Jr.</h2><div id="jrBalance" class="balance"></div><div id="jrProgressText" class="date"></div><div class="progress"><div id="jrProgress" class="bar"></div></div><div class="subhead">THIS WEEK REMINDERS</div><div id="jrReminders" class="list"></div><div class="subhead">TO STUDY AND PRACTICE</div><div id="jrStudy" class="list"></div><div class="subhead">HOMEWORK</div><div id="jrHomework" class="list"></div><div class="subhead">CHORES</div><div id="jrChores" class="list"></div><div id="jrExtra" class="list"></div></section><section class="card done=localStorage.getItem(key)==='1';return `<button class="item task ${done?'done':''}" data-key="${key}" data-kind="${kind}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div><div class="check">${done?'✓':'○'}</div></button>`}function readTimerTask(){const key='fd-jr-'+ymd(localDate())+'-read',done=localStorage.getItem(key)==='1';return `<div class="item task ${done?'done':''}" data-kind="jr"><div class="icon">📚</div><div class="txt"><div class="title">Read at least 10 minutes</div><div class="meta">Parent: fill in reading log</div><div class="timerrow"><div id="timer" class="timer">10:00</div><button id="start" class="btn" type="button">Start</button><button id="reset" class="btn" type="button">Reset</button><button class="btn readDone" data-key="${key}" type="button">${done?'✓ Done':'Mark done'}</button></div></div></div>`}function persistentTask(kind,key,icon,title,meta=''){const done=localStorage.getItem(key)==='1';return `<button class="item task ${done?'done':''}" data-key="${key}" data-kind="${kind}"><div class="icon">${icon}</div><div class="txt"><div class="title">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div><div class="check">${done?'✓':'○'}</div></button>`}function weeklyDueTask(kind,id,dueDow,icon,title,meta=''){const now=new Date();now.setHours(12,0,0,0);const due=new Date(now);due.setDate(due.getDate()-((due.getDay()-dueDow+7)%7));const key='fd-'+kind+'-'+id+'-'+ymd(due);if(localStorage.getItem(key)==='1')return '';return persistentTask(kind,key,icon,title,meta)}function monthlyDueTask(kind,id,icon,title,meta=''){const now=new Date(),month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),key='fd-'+kind+'-'+id+'-'+month;if(localStorage.getItem(key)==='1')return '';return persistentTask(kind,key,icon,title,meta)}function getEdits(){try{return JSON.parse(localStorage.getItem(EDIT_KEY)||'{"family":[],"jr":[],"x":[]}')}catch{return {family:[],jr:[],x:[]}}}function lines(v){return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function currentVerse(){const now=new Date();for(const v of verses){if(now<new Date(v[0]+'T12:00:00'))return v}return verses.at(-1)}function xavierTomorrowEvents(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+1);return xavierCalendar.filter(e=>e[0]===ymd(d))}function inNextDays(dateStr,days=7){const s=new Date();s.setHours(0,0,0,0);const e=new Date(s);e.setDate(e.getDate()+days);const d=new Date(dateStr+'T12:00:00');return d>=s&&d<=e}function upcomingSchoolItems(){return schoolCalendar.filter(e=>inNextDays(e[0],7))}function upcomingXavierItems(){return xavierCalendar.filter(e=>inNextDays(e[0],7))}function renderSchoolCalendar(){const up=upcomingSchoolItems();schoolEvents.innerHTML=up.length?up.map(x=>item('🏫',x[1],[new Date(x[0]+'T12:00:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),x[2]].filter(Boolean).join(' • '),'upcoming')).join(''):'<div class="empty">No school events in the next 7 days.</div>'}function familyEventClass(title){const t=String(title||'').toLowerCase();if(t.includes('xavier')||t.includes('brother'))return 'family-xavier';if(t.includes('erek jr')||t.includes('nugget'))return 'family-jr';if(t.includes('allworld')||t.includes('all world')||t.includes('erek'))return 'family-erek';return ''}function renderMonthCalendar(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),today=now.getDate(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();jrCalendarTitle.textContent=now.toLocaleDateString([],{month:'long',year:'numeric'});const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let html=names.map(n=>`<div class="cal-dow">${n}</div>`).join('');for(let i=0;i<first;i++)html+='<div class="cal-day blank"></div>';for(let d=1;d<=days;d++){const cls=d<today?'past':d===today?'today':'';html+=`<div class="cal-day ${cls}">${d}</div>`}jrCalendarGrid.innerHTML=html}
